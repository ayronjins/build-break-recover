name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q core console tests
      - name: Validate JSON
        run: python -m json.tool console/data/resolutions.json >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check shell syntax
        run: |
          bash -n tests/verify_boundary.sh
          bash -n tests/verify_kyverno.sh
          bash -n console/collect-remote.sh
